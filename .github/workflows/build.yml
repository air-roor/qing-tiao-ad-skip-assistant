name: Android build and rule tests

on:
  push:
    branches: [main, 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test download tracking, feedback, admin auth and retention
        run: node --test --test-timeout=20000 console/test/console.test.mjs

  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (!(Test-Path -LiteralPath $sdkManager)) { throw "sdkmanager not found at $sdkManager" }
          & $sdkManager "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with exit code $LASTEXITCODE" }

      - name: Build, test, align and verify APK
        shell: pwsh
        run: .\build.ps1 -Sdk $env:ANDROID_HOME -Jdk $env:JAVA_HOME -Platform android-35 -BuildTools 35.0.0

      - name: Upload beta debug-signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: qing-tiao-beta-debug-signed
          path: build/ad-skip-assistant-debug.apk
          if-no-files-found: error
          retention-days: 14
