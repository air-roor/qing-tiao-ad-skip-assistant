<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公测反馈 · 轻跳</title><link rel="stylesheet" href="/style.css"><script src="/app.js" type="module"></script></head><body data-page="feedback"><nav class="top"><a class="brand" href="/">Q<span>轻跳 <small>PUBLIC BETA</small></span></a><a href="/">返回下载页</a></nav><main class="form-page"><div class="eyebrow">FEEDBACK / 反馈</div><h1>你的反馈，<em>会成为下一次改进。</em></h1><p class="muted">无需登录。请提供可以重复出现的步骤；不要填写密码、验证码、聊天内容或设备 IMEI。</p><form id="feedback-form" class="card"><label>问题类型<select name="category" required><option>广告没有跳过</option><option>跳过速度慢</option><option>误点了普通按钮</option><option>无障碍自动关闭</option><option>应用选择问题</option><option>其他问题</option></select></label><div class="grid two"><label>相关应用<input name="app" maxlength="120" placeholder="例如：QQ 音乐"></label><label>轻跳版本<input name="version" maxlength="40" placeholder="例如：0.3.0-beta.7"></label><label>手机品牌和型号（可选）<input name="device" maxlength="120" placeholder="例如：华为 Pura 70"></label><label>系统版本（可选）<input name="system" maxlength="120" placeholder="例如：HarmonyOS 4.2"></label></div><label>问题描述<textarea name="detail" required minlength="4" maxlength="2000" rows="6" placeholder="第几次打开？看到什么按钮？有什么操作能重复出现？"></textarea></label><label>联系方式（可选）<input name="contact" maxlength="120" placeholder="仅在你希望开发者联系时填写"></label><label class="check"><input type="checkbox" name="includeDiagnostic">我主动附带已检查过的轻跳诊断文字</label><label id="diagnostic-field" hidden>诊断文字<textarea name="diagnostic" maxlength="4000" rows="5" placeholder="只粘贴你已检查、愿意分享的诊断文字。不会读取手机页面。"></textarea></label><div class="trap" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><label class="check"><input type="checkbox" name="consent" required>我已阅读<a href="/privacy" target="_blank" rel="noopener">网页隐私说明</a>，同意将以上内容提交给轻跳开发者，最长保留 90 天。</label><button class="primary" type="submit">确认提交反馈</button><p id="form-message" role="status"></p></form><section class="card" id="receipt" hidden><h2>反馈已收到</h2><p>请保存以下编号和删除码。删除码仅在这里显示，后台不会保存其明文。</p><pre id="receipt-text"></pre><button id="copy-receipt">复制编号和删除码</button></section><details class="card"><summary>删除我提交的反馈</summary><form id="delete-form"><label>反馈编号<input name="id" required maxlength="60"></label><label>删除码<input name="deleteToken" required maxlength="100" autocomplete="off"></label><button type="submit">删除这条反馈</button><p id="delete-message" role="status"></p></form></details></main></body></html>
